
<!DOCTYPE html>
<html>

<head>
    <title>ExamGuard Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: "Segoe UI", Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(79, 70, 229, 0.12),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(14, 165, 233, 0.10),
                    transparent 35%
                ),
                #f5f7fb;

            color: #1e293b;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 30px 20px;
        }

        h1 {
            margin: 0 0 28px;

            color: #172554;

            font-size: 30px;
            font-weight: 700;

            letter-spacing: -0.5px;
        }

        form {
            width: 380px;
            max-width: 100%;

            margin: 0;

            padding: 38px;

            background: #ffffff;

            border: 1px solid #e2e8f0;

            border-radius: 18px;

            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.10),
                0 4px 12px rgba(15, 23, 42, 0.04);

            text-align: left;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #475569;

            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            margin-top: 0;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            background: #f8fafc;

            color: #1e293b;

            font-size: 15px;

            outline: none;

            transition: all 0.2s ease;
        }

        input:hover {
            border-color: #94a3b8;
        }

        input:focus {
            background: #ffffff;

            border-color: #4f46e5;

            box-shadow:
                0 0 0 3px rgba(79, 70, 229, 0.11);
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #2563eb
                );

            color: #ffffff;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);

            background:
                linear-gradient(
                    135deg,
                    #4338ca,
                    #1d4ed8
                );

            box-shadow:
                0 8px 20px rgba(37, 99, 235, 0.22);
        }

        button:active {
            transform: translateY(0);
        }

        @media (max-width: 500px) {

            body {
                padding: 20px 15px;
            }

            h1 {
                font-size: 25px;
            }

            form {
                padding: 28px 22px;
            }

        }

    </style>

</head>

<body>

    <h1>Candidate Login</h1>

    <form method="POST">

        <label>Email:</label>

        <input 
            type="email" 
            name="email" 
            required
        >

        <br><br>

        <label>Password:</label>

        <input 
            type="password" 
            name="password" 
            required
        >

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

</body>

</html>
