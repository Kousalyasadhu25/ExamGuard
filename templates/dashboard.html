
<!DOCTYPE html>
<html>

<head>
    <title>ExamGuard Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f7f5;
            color: #17201c;
            display: flex;
            flex-direction: column;
        }

        /* ================= NAVBAR ================= */

        body::before {
            content: "EXAMGUARD";
            display: flex;
            align-items: center;
            height: 72px;
            padding: 0 7%;
            background: #ffffff;
            border-bottom: 1px solid #e5ebe7;
            color: #14532d;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* ================= MAIN ================= */

        h1 {
            width: min(900px, 90%);
            margin: 65px auto 15px;
            font-size: 38px;
            line-height: 1.2;
            letter-spacing: -1.2px;
            color: #17201c;
        }

        p {
            width: min(900px, 90%);
            margin: 0 auto;
            color: #64748b;
            font-size: 16px;
            line-height: 1.7;
        }

        /* ================= LOGOUT ================= */

        a {
            position: absolute;
            top: 21px;
            right: 7%;
            text-decoration: none;
            color: #475569;
            background: #f8faf9;
            border: 1px solid #e2e8e4;
            padding: 9px 17px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        a:hover {
            background: #f0fdf4;
            color: #15803d;
            border-color: #bbf7d0;
            transform: translateY(-1px);
        }

        /* ================= DASHBOARD CONTENT ================= */

        h1 + p {
            margin-bottom: 35px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            body::before {
                height: 64px;
                padding: 0 5%;
                font-size: 18px;
            }

            a {
                top: 17px;
                right: 5%;
                padding: 8px 13px;
                font-size: 13px;
            }

            h1 {
                margin-top: 45px;
                font-size: 30px;
            }

            p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <h1>Candidate Dashboard</h1>

    <p>Welcome to ExamGuard!</p>

    <a href="/logout">Logout</a>

</body>

</html>
