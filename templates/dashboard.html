
<!DOCTYPE html>
<html>

<head>
    <title>ExamGuard Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: "Segoe UI", Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(79, 70, 229, 0.12),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(14, 165, 233, 0.10),
                    transparent 35%
                ),
                #f5f7fb;

            color: #1e293b;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 20px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 12px;

            color: #172554;

            font-size: 30px;
            font-weight: 700;

            letter-spacing: -0.5px;
        }

        p {
            margin: 0;

            color: #64748b;

            font-size: 16px;

            line-height: 1.6;
        }

        .dashboard-box {
            width: 500px;
            max-width: 100%;

            margin: 0;

            padding: 50px 40px;

            background: #ffffff;

            border: 1px solid #e2e8f0;

            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.10),
                0 4px 12px rgba(15, 23, 42, 0.04);

            text-align: center;
        }

        a {
            display: inline-block;

            margin-top: 28px;

            padding: 12px 28px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #2563eb
                );

            color: #ffffff;

            text-decoration: none;

            border-radius: 9px;

            font-size: 14px;

            font-weight: 600;

            transition: all 0.2s ease;
        }

        a:hover {
            transform: translateY(-1px);

            background:
                linear-gradient(
                    135deg,
                    #4338ca,
                    #1d4ed8
                );

            box-shadow:
                0 8px 20px rgba(37, 99, 235, 0.22);
        }

        a:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {

            body {
                padding: 20px 15px;
            }

            .dashboard-box {
                padding: 38px 25px;
            }

            h1 {
                font-size: 25px;
            }

        }

    </style>

</head>

<body>

    <div class="dashboard-box">

        <h1>Candidate Dashboard</h1>

        <p>Welcome to ExamGuard!</p>

        <a href="/logout">Logout</a>

    </div>

</body>

</html>
